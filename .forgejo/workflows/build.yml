name: Automated build

on: [push, pull_request]

jobs:
  build:
    if: "!startsWith(github.event.head_commit.message, '[skip]')"
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v5
      - uses: https://github.com/gradle/actions/wrapper-validation@v4
      - uses: https://github.com/actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v4
        with:
            cache-read-only: ${{ github.ref != 'refs/heads/multiversion' || github.ref != 'refs/heads/dev' }}

      - name: Build
        run: ./gradlew build collectBuilds

      - name: Upload a Build Artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          # Artifact name
          name: AxolotlClient-automation
          path: builds/*.jar
