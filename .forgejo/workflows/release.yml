name: Release
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  release:
    name: "Tagged Release"
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    permissions:
      contents: write
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v5

      - uses: https://github.com/actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag

      - uses: https://github.com/actions/setup-java@v4
        if: "github.ref == 'refs/tags/${{ steps.get-latest-tag.outputs.tag }}'"
        with:
          distribution: "temurin"
          java-version: 21

      - name: Build
        run: ./gradlew build collectBuilds

      - name: Generate Version Changelog
        run: ./gradlew generateVersionChangelog

      - name: Release
        uses: https://github.com/Kira-NT/mc-publish@v3.3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          changelog-file: "build/changelog"
          files: builds/*.jar
